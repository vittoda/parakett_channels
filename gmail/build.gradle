plugins {
    id 'java'
    id 'maven-publish' 
}

group = 'com.flowstack.channels'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // Core base interface dependency
    implementation group: 'com.flowstack.channels', name: 'channels-base', version: '1.0.0'
    
    // JSON processing
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.21.2' 

   implementation 'org.slf4j:slf4j-api:2.0.18'
   runtimeOnly 'ch.qos.logback:logback-classic:1.5.38'

}

jar {
    manifest {
        attributes 'Main-Class': 'com.flowstack.channels.gmail.App'
    }
}

// Configuration to publish this plugin to your local machine's Maven cache (~/.m2)
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}